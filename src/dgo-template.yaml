id: https://w3id.org/dgo/template
name: dgo_template
description: >-
  Authoring template for downstream implementers. Imports the DGO ontology and
  adds a document root plus registries so governance setups can be written as
  LinkML instance data. Never run gen-owl on this file.
prefixes:
  ex: https://w3id.org/dgo/data/
  # The RDF dumper expands CURIEs with the root schema's prefixes only, so the
  # ones DGO's slots and classes use are repeated here.
  dgo: https://w3id.org/dgo/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  bfo: http://purl.obolibrary.org/obo/BFO_
  iao: http://purl.obolibrary.org/obo/IAO_
  ro: http://purl.obolibrary.org/obo/RO_
default_prefix: dgo
imports:
  - dgo

classes:
  GovernanceRecord:
    tree_root: true
    description: One document holding a governance setup and its registries.
    slots: [processes, councils, people, organizations, council_roles, governance_roles,
            business_glossaries, domains, subject_areas, glossary_terms, definition_sources,
            term_creations, term_modifications, term_deprecations, status_boundaries,
            term_status_boundaries, data_stores, data_sets, data_elements,
            data_set_certifications, sensitivity_levels, security_levels,
            regulations]

slots:
  processes:
    range: data governance
    multivalued: true
    inlined_as_list: true
  councils:
    range: data governance council
    multivalued: true
    inlined_as_list: true
  people:
    range: person
    multivalued: true
    inlined_as_list: true
  organizations:
    range: organization
    multivalued: true
    inlined_as_list: true
  council_roles:
    range: council role
    multivalued: true
    inlined_as_list: true
  governance_roles:
    range: governance role
    multivalued: true
    inlined_as_list: true
  domains:
    range: domain
    multivalued: true
    inlined_as_list: true
  subject_areas:
    range: subject area
    multivalued: true
    inlined_as_list: true
  glossary_terms:
    range: glossary term
    multivalued: true
    inlined_as_list: true
  term_creations:
    range: term creation
    multivalued: true
    inlined_as_list: true
  definition_sources:
    range: definition source
    multivalued: true
    inlined_as_list: true
  term_modifications:
    range: term modification
    multivalued: true
    inlined_as_list: true
  term_deprecations:
    range: term deprecation
    multivalued: true
    inlined_as_list: true
  status_boundaries:
    description: Status boundaries of any lifecycle process (terms and certifications).
    range: status boundary
    multivalued: true
    inlined_as_list: true
  term_status_boundaries:
    deprecated: Use status_boundaries, which also holds data set certification boundaries.
    range: status boundary
    multivalued: true
    inlined_as_list: true
  business_glossaries:
    range: business glossary
    multivalued: true
    inlined_as_list: true
  data_stores:
    range: data store
    multivalued: true
    inlined_as_list: true
  data_sets:
    range: data set
    multivalued: true
    inlined_as_list: true
  data_elements:
    range: data element
    multivalued: true
    inlined_as_list: true
  data_set_certifications:
    range: data set certification
    multivalued: true
    inlined_as_list: true
  sensitivity_levels:
    range: sensitivity level
    multivalued: true
    inlined_as_list: true
  security_levels:
    range: security level
    multivalued: true
    inlined_as_list: true
  regulations:
    range: regulatory category
    multivalued: true
    inlined_as_list: true
