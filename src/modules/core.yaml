id: https://w3id.org/dgo/core
name: dgo_core
description: >-
  An ontology for data governance: business terms, subject areas,
  stewardship roles and responsibilities, term-lifecycle status,
  data classification, and semantic typing.
version: 0.1.0
license: https://w3id.org/dgo/LICENSE

prefixes:
  linkml: https://w3id.org/linkml/
  dgo: https://w3id.org/dgo/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  org: http://www.w3.org/ns/org#
  prov: http://www.w3.org/ns/prov#
  foaf: http://xmlns.com/foaf/0.1/
  schema: http://schema.org/
  vann: http://purl.org/vocab/vann/
  bibo: http://purl.org/ontology/bibo/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  obo: http://purl.obolibrary.org/obo/
  bfo: http://purl.obolibrary.org/obo/BFO_
  obi: http://purl.obolibrary.org/obo/OBI_
  iao: http://purl.obolibrary.org/obo/IAO_
  owl: http://www.w3.org/2002/07/owl#
  ro:  http://purl.obolibrary.org/obo/RO_
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
default_prefix: dgo

imports:
  - linkml:types

classes:

  entity:
    class_uri: bfo:0000001

  identifiable:
    mixin: true
    slots: [id, label]

slots:

  id:
    description: The term's globally unique, persistent IRI. Its stable identity.
    identifier: true
    range: uriorcurie

  label:
    description: >-
      Words
    implements: [owl:AnnotationProperty]
    slot_uri: rdfs:label
    range: string
    required: true

  type:
    description: >-
      The specific subclass this object instantiates, given as its class IRI (e.g. a chair).
      Lets instance data name a subclass; emitted as rdf:type.
    designates_type: true
    slot_uri: rdf:type
    range: uriorcurie

  part_of:
    description: >-
      Parthood (BFO part of). Transitive: a subject area that is part of a
      domain that is part of a glossary is part of that glossary too. Each class
      narrows the range with slot_usage (a term is part of a glossary, a subject
      area is part of a domain, a governance process is part of a broader
      process, and so on).
    slot_uri: bfo:0000050
    range: entity
    transitive: true
    inlined: false

  description:
    description: A human-readable account of the thing, for readers.
    slot_uri: dcterms:description
    range: string
    implements: [owl:AnnotationProperty]

  definition:
    slot_uri: dgo:DGO_00000028
    close_mappings: [iao:0000115]   
    description: The meaning of the term.
    range: string
    required: true
