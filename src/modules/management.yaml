id: https://w3id.org/dgo/management
name: dgo_management
default_prefix: dgo
imports:
  - core

classes:

  role:
    class_uri: bfo:0000023

  object:
    class_uri: bfo:0000030

  object aggregate:
    class_uri: bfo:0000027

  process:
    class_uri: bfo:0000015

  data governance:
    class_uri: dgo:DGO_00000001
    is_a: process
    mixins: [identifiable]
    slots: [part_of]
    slot_usage:
      part_of: { range: data governance }
    description: >-
      A process of governing an organization's data.

  data governance council:
    class_uri: dgo:DGO_00000002
    is_a: object aggregate
    mixins: [identifiable]
    slots: [participates_in, has_member]
    description: >-
      A group whose collective role is to implement the data governance process to which it is assigned.

  person:
    class_uri: dgo:DGO_00000003
    is_a: object
    mixins: [identifiable]
    slots: [email, title]
    # optional cross-walk without committing to the taxonomy:
    exact_mappings:
      - http://purl.obolibrary.org/obo/NCBITaxon_9606
    description: >-
      An individual human being.

  organization:
    class_uri: dgo:DGO_00000004
    is_a: object aggregate
    mixins: [identifiable]
    slots: [has_member, email]
    description: >-
      A group of people organized for a specific purpose or set of purposes within an organization.

  council role:
    is_a: role
    class_uri: dgo:DGO_00000005
    slots: [type, role_of, realized_in]
    description: What facet of stewardship the holder is responsible for on a Governance Council.

  member:
    is_a: council role
    class_uri: dgo:DGO_00000035
    description: >-
      An individual convened as part of a council to provide general advisement
      without a specific leadership role, e.g. as an at-large participant.

  chair:
    is_a: council role
    class_uri: dgo:DGO_00000006
    description: Convenes the council and owns final sign-off on decisions.

  security steward:
    is_a: council role
    class_uri: dgo:DGO_00000007
    description: Advises on access controls and safeguarding of the data.

  ethics steward:
    is_a: council role
    class_uri: dgo:DGO_00000008
    description: Advises on ethical use and transparency across the organization.

  documentation steward:
    is_a: council role
    class_uri: dgo:DGO_00000009
    description: Keeps definitions, lineage, and decisions documented.

  compliance steward:
    is_a: council role
    class_uri: dgo:DGO_00000010
    description: Advises on regulatory and policy conformance.

  governance role:
    is_a: role
    class_uri: dgo:DGO_00000011
    slots: [type, role_of, realized_in]
    description: What an individual or entity is responsible for with respect to a managed term.

  owner:
    is_a: governance role
    class_uri: dgo:DGO_00000012
    description: Accountable for approving data definition.

  steward:
    is_a: governance role
    class_uri: dgo:DGO_00000013
    description: Responsible for quality of implementing data.

  custodian:
    is_a: governance role
    class_uri: dgo:DGO_00000014
    description: Consulted on the collection, storage, and management of data.

  subject matter expert:
    is_a: governance role
    class_uri: dgo:DGO_00000015
    description: Consulted on meaning and use of data in practice.

slots:

  participates_in:
    description: The data governance process this council carries out.
    slot_uri: ro:0000056
    range: data governance
    inlined: false

  has_member:
    description: A person or organization that is a member of a council or other organization.
    slot_uri: ro:0002351
    range: identifiable
    multivalued: true
    inlined: false
    any_of:
      - range: person
      - range: organization

  role_of:
    description: The person, organization, or council that bears this role.
    slot_uri: ro:0000081
    range: identifiable
    any_of:
      - range: person
      - range: organization
      - range: data governance council

  realized_in:
    description: The governance process in which this role is realized.
    slot_uri: bfo:0000055
    range: data governance

  email:
    description: >-
      A contact email address, as a plain string. (Not foaf:mbox, which expects
      a mailto: IRI.)
    slot_uri: schema:email
    range: string

  title:
    description: >-
      A person's job title. (Not foaf:title, which is an honorific such as Dr.)
    slot_uri: schema:jobTitle
    range: string

