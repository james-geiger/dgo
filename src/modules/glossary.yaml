id: https://w3id.org/dgo/glossary
name: dgo_glossary
default_prefix: dgo
imports:
  - core
  - management

classes:

  information content entity:
    class_uri: iao:0000030

  process boundary:
    class_uri: bfo:0000035

  domain:
    class_uri: dgo:DGO_00000016
    is_a: information content entity
    description: >-
      A group of glossary terms that relates to a particular section or definable .
    slots: [id, label, part_of]
    slot_usage:
      part_of: { range: business glossary }

  subject area:
    class_uri: dgo:DGO_00000017
    is_a: information content entity
    title: Subject Area
    description: >-
      A governed grouping of terms which is more specific.
    slots: [id, label, part_of]
    slot_usage:
      part_of: { range: domain, required: true }

  business glossary:
    class_uri: dgo:DGO_00000018
    is_a: information content entity
    description: >-
      A glossary is a grouping of terms.
    slots: [id, label]

  glossary term:
    class_uri: dgo:DGO_00000019
    is_a: information content entity
    description: >-
      A governed business term that relates, in whole or in part, to data that exists within an organization's governance.
    slots:
      - id
      - label
      - pref_label
      - alt_labels
      - definition
      - definition_source
      - part_of
      - in_subject_area
      - broader
      - related
      - value_of
      - semantic_type
      - replaced_by
      - responsibilities
    slot_usage:
      part_of: { range: business glossary, required: true }
      in_subject_area: { required: true }

  definition source:
    class_uri: dgo:DGO_00000030
    is_a: information content entity
    description: >-
      A source that a term's definition is drawn from. Its id is the source's
      IRI; its label describes the source. Many terms may cite one source.
    slots: [id, label]

  term lifecycle process:
    class_uri: dgo:DGO_00000020
    is_a: data governance
    description: >-
      A governance process that brings a business term into, or changes it within,
      the business glossary.
    slots: [has_output, has_participant]
    slot_usage:
      has_output: { required: true }
  
  term creation:
    class_uri: dgo:DGO_00000021
    is_a: term lifecycle process
    description: >-
      The process by which a new governed business term is proposed, validated, and approved for publishing in the 
      business glossary.

  term modification:
    class_uri: dgo:DGO_00000022
    is_a: term lifecycle process
    description: >-
      The process by which an extant governed business term is proposed to be modified, validated, and approved for publishing in the
      business glossary.

  term deprecation:
    class_uri: dgo:DGO_00000031
    is_a: term lifecycle process
    description: >-
      The process by which an extant governed business term is proposed to be retired from
      the business glossary. The term is deprecated once this process reaches its approved boundary.

  status boundary:
    class_uri: dgo:DGO_00000023
    is_a: process boundary
    description: >-
      The moment a term's status changed during a lifecycle process.
    slots: [type, part_of, occurred_on]
    slot_usage:
      part_of: { range: term lifecycle process, required: true }
      occurred_on: { required: true }

  drafted:
    class_uri: dgo:DGO_00000024
    is_a: status boundary
    description: >-
      The point where a term or modification has been first drafted.

  submitted for review:
    class_uri: dgo:DGO_00000025
    is_a: status boundary
    description: >-
      The point where a term or modification has moved into being verified by a data steward.

  approved:
    class_uri: dgo:DGO_00000026
    is_a: status boundary
    description: >-
      The point where a term or modification, resulting from a decision of the responsible data
      governance council, has been made final. 
    
  rejected:
    class_uri: dgo:DGO_00000027
    is_a: status boundary
    description: >-
      The point where a term or modification, resulting from a decision of the responsible data
      governance council, is no longer under consideration. 

slots:

  in_subject_area:
    description: >-
      The subject area this term is classified under. Classification, not
      containment: a term is part of its glossary, never of a subject area.
      (RO's "member of" is a sub-property of part of, so it isn't used here.)
    slot_uri: dgo:DGO_00000029
    range: subject area
    inlined: false

  occurred_on:
    description: >-
      The date of an action.
    slot_uri: dcterms:date
    range: date
    implements: [owl:AnnotationProperty]

  definition:
    slot_uri: dgo:DGO_00000028
    close_mappings: [iao:0000115]   
    description: The meaning of the term.
    range: string
    required: true

  pref_label:
    description: >-
      The form of the term shown to readers, when it differs from the label.
      Must differ from every alt label.
    slot_uri: skos:prefLabel
    range: string
    implements: [owl:AnnotationProperty]

  alt_labels:
    description: Other names the term is known by (synonyms, abbreviations).
    slot_uri: skos:altLabel
    range: string
    multivalued: true
    implements: [owl:AnnotationProperty]

  definition_source:
    description: The source the term's definition is drawn from.
    slot_uri: dcterms:source
    range: definition source
    inlined: false

  broader:
    description: >-
      A more general term. Not transitive; query ancestors with skos:broader+.
    slot_uri: skos:broader
    range: glossary term
    multivalued: true
    inlined: false

  related:
    description: >-
      A term associated with this one, not by hierarchy. Symmetric; query
      in both directions with skos:related|^skos:related.
    slot_uri: skos:related
    range: glossary term
    multivalued: true
    inlined: false

  value_of:
    description: >-
      The attribute term this term is a value of (e.g. "on hold" is a value
      of "accrual status").
    slot_uri: dgo:DGO_00000032
    range: glossary term
    inlined: false

  semantic_type:
    description: >-
      The kind of thing the term denotes, given as the IRI of a class in an
      external ontology (e.g. "clinical trial" denotes a BFO process). Types the
      term's referent, not the term itself: the term stays an information
      content entity.
    slot_uri: dgo:DGO_00000034
    range: uriorcurie
    multivalued: false
    implements: [owl:AnnotationProperty]

  replaced_by:
    description: The term that succeeds this one, once it is deprecated.
    slot_uri: dcterms:isReplacedBy
    range: glossary term
    inlined: false

  responsibilities:
    description: >-
      The governance roles held with respect to this term (owner, steward,
      custodian, subject matter expert), each naming who bears it.
    slot_uri: dgo:DGO_00000033
    range: governance role
    multivalued: true
    inlined_as_list: true

  has_output:
    description: The term this creation process produced.
    slot_uri: ro:0002234
    range: glossary term
    inlined: false

  has_participant:
    description: Who took part in this process.
    slot_uri: ro:0000057
    multivalued: true
    inlined: false
    any_of:
      - range: person
      - range: organization
      - range: data governance council
