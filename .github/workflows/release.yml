# Rebuild dist/dgo.owl.ttl and dist/dgo.yaml when a release is published:
#  1. build from the release tag and attach both files to the release;
#  2. rebuild on the default branch and commit dist/ back if it changed.
name: Build dist on release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIST_FILES: dist/dgo.owl.ttl dist/dgo.yaml
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version

      - name: Build from tag
        run: uv run build.py

      - name: Attach dist files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" $DIST_FILES --clobber

      - name: Check out default branch
        run: |
          git reset --hard
          git checkout -B "$BRANCH" "origin/$BRANCH"
        env:
          BRANCH: ${{ github.event.repository.default_branch }}

      - name: Build from default branch
        run: uv run build.py

      - name: Commit dist if changed
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.event.release.tag_name || 'manual run' }}
        run: |
          if git diff --quiet -- $DIST_FILES; then
            echo "dist is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DIST_FILES
          git commit -m "Build dist for $TAG [skip ci]"
          git push origin "$BRANCH"
