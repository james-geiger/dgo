description: 'An ontology for data governance: business terms, subject areas, stewardship
  roles and responsibilities, term-lifecycle status, semantic typing, and the governed
  data itself: data stores, data sets, data elements, their sensitivity, security
  and regulatory classification, certification, and lineage from source of truth to
