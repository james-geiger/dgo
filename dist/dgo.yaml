default_prefix: dgo
default_range: string
slots:
  id:
    name: id
    description: The term's globally unique, persistent IRI. Its stable identity.
    from_schema: https://w3id.org/dgo/core
    identifier: true
    range: uriorcurie
  label:
    name: label
    implements:
    - owl:AnnotationProperty
    description: Words
    from_schema: https://w3id.org/dgo/core
    slot_uri: rdfs:label
    range: string
    required: true
  type:
    name: type
    description: The specific subclass this object instantiates, given as its class
      IRI (e.g. a chair). Lets instance data name a subclass; emitted as rdf:type.
    from_schema: https://w3id.org/dgo/core
    slot_uri: rdf:type
    designates_type: true
    range: uriorcurie
  part_of:
    name: part_of
    description: 'Parthood (BFO part of). Transitive: a subject area that is part
      of a domain that is part of a glossary is part of that glossary too. Each class
      narrows the range with slot_usage (a term is part of a glossary, a subject area
      is part of a domain, a governance process is part of a broader process, and
      so on).'
    from_schema: https://w3id.org/dgo/core
    slot_uri: bfo:0000050
    transitive: true
    range: entity
    inlined: false
  description:
    name: description
    implements:
    - owl:AnnotationProperty
    description: A human-readable account of the thing, for readers.
    from_schema: https://w3id.org/dgo/core
    slot_uri: dcterms:description
    range: string
  definition:
    name: definition
    description: The meaning of the term.
    from_schema: https://w3id.org/dgo/core
    close_mappings:
    - iao:0000115
    slot_uri: dgo:DGO_00000028
    range: string
    required: true
  participates_in:
    name: participates_in
    description: The data governance process this council carries out.
    from_schema: https://w3id.org/dgo/management
    slot_uri: ro:0000056
    range: data governance
    inlined: false
  has_member:
    name: has_member
    description: A person or organization that is a member of a council or other organization.
    from_schema: https://w3id.org/dgo/management
    slot_uri: ro:0002351
    range: identifiable
    multivalued: true
    inlined: false
    any_of:
    - range: person
    - range: organization
  role_of:
    name: role_of
    description: The person, organization, or council that bears this role.
    from_schema: https://w3id.org/dgo/management
    slot_uri: ro:0000081
    range: identifiable
    any_of:
    - range: person
    - range: organization
    - range: data governance council
  realized_in:
    name: realized_in
    description: The governance process in which this role is realized.
    from_schema: https://w3id.org/dgo/management
    slot_uri: bfo:0000055
    range: data governance
  email:
    name: email
    description: 'A contact email address, as a plain string. (Not foaf:mbox, which
      expects a mailto: IRI.)'
    from_schema: https://w3id.org/dgo/management
    slot_uri: schema:email
    range: string
  title:
    name: title
    description: A person's job title.
    from_schema: https://w3id.org/dgo/management
    slot_uri: schema:jobTitle
    range: string
  occurred_on:
    name: occurred_on
    implements:
    - owl:AnnotationProperty
    description: The date of an action.
    from_schema: https://w3id.org/dgo/management
    slot_uri: dcterms:date
    range: date
  has_output:
    name: has_output
    description: What this lifecycle process produced or changed.
    from_schema: https://w3id.org/dgo/management
    slot_uri: ro:0002234
    range: identifiable
    inlined: false
  has_participant:
    name: has_participant
    description: Who took part in this process.
    from_schema: https://w3id.org/dgo/management
    slot_uri: ro:0000057
    range: identifiable
    multivalued: true
    inlined: false
    any_of:
    - range: person
    - range: organization
    - range: data governance council
  responsibilities:
    name: responsibilities
    description: The governance roles held with respect to this term, data store,
      data set or data element (owner, steward, custodian, subject matter expert),
      each naming who bears it.
    from_schema: https://w3id.org/dgo/management
    slot_uri: dgo:DGO_00000033
    range: governance role
    multivalued: true
    inlined_as_list: true
  in_subject_area:
    name: in_subject_area
    description: The subject area this term or data set is classified under, and through
      it the domain.
    from_schema: https://w3id.org/dgo/domains
    slot_uri: dgo:DGO_00000029
    range: subject area
    inlined: false
  stored_in:
    name: stored_in
    description: The data store that carries this data set (RO generically depends
      on).
    from_schema: https://w3id.org/dgo/datasets
    slot_uri: ro:0010001
    range: data store
    multivalued: true
    inlined: false
  derived_from:
    name: derived_from
    description: The data set or data element this one was produced from. Not transitive;
      follow a lineage back to its source of truth with a property path (derived from,
      one or more times).
    from_schema: https://w3id.org/dgo/datasets
    close_mappings:
    - prov:wasDerivedFrom
    slot_uri: dgo:DGO_00000045
    range: identifiable
    multivalued: true
    inlined: false
    any_of:
    - range: data set
    - range: data element
  sensitivity:
    name: sensitivity
    description: The sensitivity level of this data.
    from_schema: https://w3id.org/dgo/datasets
    slot_uri: dgo:DGO_00000046
    range: sensitivity level
    inlined: false
  security_level:
    name: security_level
    description: The security level this data requires.
    from_schema: https://w3id.org/dgo/datasets
    slot_uri: dgo:DGO_00000047
    range: security level
    inlined: false
  regulatory_categories:
    name: regulatory_categories
    description: The regulatory regimes this data falls under.
    from_schema: https://w3id.org/dgo/datasets
    slot_uri: dgo:DGO_00000048
    range: regulatory category
    multivalued: true
    inlined: false
  severity:
    name: severity
    implements:
    - owl:AnnotationProperty
    description: 'The level''s position within its organization''s scheme: higher
      means more harm on disclosure (sensitivity) or stricter controls (security).
      Lets lineage checks find the most severe level along a path.'
    from_schema: https://w3id.org/dgo/datasets
    slot_uri: dgo:DGO_00000049
    range: integer
  pref_label:
    name: pref_label
    implements:
    - owl:AnnotationProperty
    description: The form of the term shown to readers, when it differs from the label.
      Must differ from every alt label.
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: skos:prefLabel
    range: string
  alt_labels:
    name: alt_labels
    implements:
    - owl:AnnotationProperty
    description: Other names the term is known by (synonyms, abbreviations).
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: skos:altLabel
    range: string
    multivalued: true
  definition_source:
    name: definition_source
    implements:
    - owl:AnnotationProperty
    description: The source the term's definition is drawn from.
    from_schema: https://w3id.org/dgo/glossary
    exact_mappings:
    - iao:0000119
    close_mappings:
    - dcterms:source
    slot_uri: dgo:DGO_00000050
    range: definition source
    inlined: false
  broader:
    name: broader
    description: A more general term. Not transitive; query ancestors with skos:broader+.
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: skos:broader
    range: glossary term
    multivalued: true
    inlined: false
  related:
    name: related
    description: A term associated with this one, not by hierarchy. Symmetric; query
      in both directions with skos:related|^skos:related.
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: skos:related
    range: glossary term
    multivalued: true
    inlined: false
  value_of:
    name: value_of
    description: The attribute term this term is a value of (e.g. "on hold" is a value
      of "accrual status").
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: dgo:DGO_00000032
    range: glossary term
    inlined: false
  semantic_type:
    name: semantic_type
    implements:
    - owl:AnnotationProperty
    description: 'The kind of thing the term denotes, given as the IRI of a class
      in an external ontology (e.g. "clinical trial" denotes a BFO process). Types
      the term''s referent, not the term itself: the term stays an information content
      entity.'
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: dgo:DGO_00000034
    range: uriorcurie
    multivalued: false
  replaced_by:
    name: replaced_by
    implements:
    - owl:AnnotationProperty
    description: The term that succeeds this one, once it is deprecated.
    from_schema: https://w3id.org/dgo/glossary
    exact_mappings:
    - iao:0100001
    close_mappings:
    - dcterms:isReplacedBy
    slot_uri: dgo:DGO_00000051
    range: glossary term
    inlined: false
  informed_by:
    name: informed_by
    description: The data elements whose values define or determine this term (e.g.
      a protocol status and an open date together determine "active study"). Information
      flows up from the data into the term.
    from_schema: https://w3id.org/dgo/glossary
    slot_uri: dgo:DGO_00000044
    range: data element
    multivalued: true
    inlined: false
classes:
  entity:
    name: entity
    from_schema: https://w3id.org/dgo/core
    class_uri: bfo:0000001
  identifiable:
    name: identifiable
    from_schema: https://w3id.org/dgo/core
    mixin: true
    slots:
    - id
    - label
  role:
    name: role
    from_schema: https://w3id.org/dgo/management
    class_uri: bfo:0000023
  object:
    name: object
    from_schema: https://w3id.org/dgo/management
    class_uri: bfo:0000030
  object aggregate:
    name: object aggregate
    from_schema: https://w3id.org/dgo/management
    class_uri: bfo:0000027
  process:
    name: process
    from_schema: https://w3id.org/dgo/management
    class_uri: bfo:0000015
  data governance:
    name: data governance
    description: A process of governing an organization's data.
    from_schema: https://w3id.org/dgo/management
    is_a: process
    mixins:
    - identifiable
    slots:
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: data governance
    class_uri: dgo:DGO_00000001
  process boundary:
    name: process boundary
    from_schema: https://w3id.org/dgo/management
    class_uri: bfo:0000035
  lifecycle process:
    name: lifecycle process
    description: A governance process that brings a governed artifact (a glossary
      term, a data set) into, or changes its standing within, governance. Its progress
      is marked by status boundaries.
    from_schema: https://w3id.org/dgo/management
    is_a: data governance
    abstract: true
    slots:
    - has_output
    - has_participant
    class_uri: dgo:DGO_00000036
  status boundary:
    name: status boundary
    description: The moment a governed artifact's status changed during a lifecycle
      process.
    from_schema: https://w3id.org/dgo/management
    is_a: process boundary
    slots:
    - type
    - part_of
    - occurred_on
    slot_usage:
      part_of:
        name: part_of
        range: lifecycle process
        required: true
      occurred_on:
        name: occurred_on
        required: true
    class_uri: dgo:DGO_00000023
  drafted:
    name: drafted
    description: The point where a term, modification, or certification has been first
      drafted.
    from_schema: https://w3id.org/dgo/management
    is_a: status boundary
    class_uri: dgo:DGO_00000024
  submitted for review:
    name: submitted for review
    description: The point where a term, modification, or certification has moved
      into being verified by a data steward.
    from_schema: https://w3id.org/dgo/management
    is_a: status boundary
    class_uri: dgo:DGO_00000025
  approved:
    name: approved
    description: The point where a term, modification, or certification, resulting
      from a decision of the responsible data governance council, has been made final.
    from_schema: https://w3id.org/dgo/management
    is_a: status boundary
    class_uri: dgo:DGO_00000026
  rejected:
    name: rejected
    description: The point where a term, modification, or certification, resulting
      from a decision of the responsible data governance council, is no longer under
      consideration.
    from_schema: https://w3id.org/dgo/management
    is_a: status boundary
    class_uri: dgo:DGO_00000027
  data governance council:
    name: data governance council
    description: A group whose collective role is to implement the data governance
      process to which it is assigned.
    from_schema: https://w3id.org/dgo/management
    is_a: object aggregate
    mixins:
    - identifiable
    slots:
    - participates_in
    - has_member
    class_uri: dgo:DGO_00000002
  person:
    name: person
    description: An individual human being.
    from_schema: https://w3id.org/dgo/management
    exact_mappings:
    - http://purl.obolibrary.org/obo/NCBITaxon_9606
    is_a: object
    mixins:
    - identifiable
    slots:
    - email
    - title
    class_uri: dgo:DGO_00000003
  organization:
    name: organization
    description: A group of people organized for a specific purpose or set of purposes
      within an organization.
    from_schema: https://w3id.org/dgo/management
    is_a: object aggregate
    mixins:
    - identifiable
    slots:
    - has_member
    - email
    class_uri: dgo:DGO_00000004
  council role:
    name: council role
    description: What facet of stewardship the holder is responsible for on a Governance
      Council.
    from_schema: https://w3id.org/dgo/management
    is_a: role
    slots:
    - type
    - role_of
    - realized_in
    class_uri: dgo:DGO_00000005
  member:
    name: member
    description: An individual convened as part of a council to provide general advisement
      without a specific leadership role, e.g. as an at-large participant.
    from_schema: https://w3id.org/dgo/management
    is_a: council role
    class_uri: dgo:DGO_00000035
  chair:
    name: chair
    description: Convenes the council and owns final sign-off on decisions.
    from_schema: https://w3id.org/dgo/management
    is_a: council role
    class_uri: dgo:DGO_00000006
  security steward:
    name: security steward
    description: Advises on access controls and safeguarding of the data.
    from_schema: https://w3id.org/dgo/management
    is_a: council role
    class_uri: dgo:DGO_00000007
  ethics steward:
    name: ethics steward
    description: Advises on ethical use and transparency across the organization.
    from_schema: https://w3id.org/dgo/management
    is_a: council role
    class_uri: dgo:DGO_00000008
  documentation steward:
    name: documentation steward
    description: Keeps definitions, lineage, and decisions documented.
    from_schema: https://w3id.org/dgo/management
    is_a: council role
    class_uri: dgo:DGO_00000009
  compliance steward:
    name: compliance steward
    description: Advises on regulatory and policy conformance.
    from_schema: https://w3id.org/dgo/management
    is_a: council role
    class_uri: dgo:DGO_00000010
  governance role:
    name: governance role
    description: What an individual or entity is responsible for with respect to a
      managed term.
    from_schema: https://w3id.org/dgo/management
    is_a: role
    slots:
    - type
    - role_of
    - realized_in
    class_uri: dgo:DGO_00000011
  owner:
    name: owner
    description: Accountable for approving data definition.
    from_schema: https://w3id.org/dgo/management
    is_a: governance role
    class_uri: dgo:DGO_00000012
  steward:
    name: steward
    description: Responsible for quality of implementing data.
    from_schema: https://w3id.org/dgo/management
    is_a: governance role
    class_uri: dgo:DGO_00000013
  custodian:
    name: custodian
    description: Consulted on the collection, storage, and management of data.
    from_schema: https://w3id.org/dgo/management
    is_a: governance role
    class_uri: dgo:DGO_00000014
  subject matter expert:
    name: subject matter expert
    description: Consulted on meaning and use of data in practice.
    from_schema: https://w3id.org/dgo/management
    is_a: governance role
    class_uri: dgo:DGO_00000015
  information content entity:
    name: information content entity
    from_schema: https://w3id.org/dgo/domains
    class_uri: iao:0000030
  domain:
    name: domain
    description: A group of glossary terms that relates to a particular section or
      definable .
    from_schema: https://w3id.org/dgo/domains
    is_a: information content entity
    slots:
    - id
    - label
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: business glossary
    class_uri: dgo:DGO_00000016
  subject area:
    name: subject area
    description: A governed grouping of terms which is more specific.
    title: Subject Area
    from_schema: https://w3id.org/dgo/domains
    is_a: information content entity
    slots:
    - id
    - label
    - part_of
    slot_usage:
      part_of:
        name: part_of
        range: domain
        required: true
    class_uri: dgo:DGO_00000017
  business glossary:
    name: business glossary
    description: A glossary is a grouping of terms.
    from_schema: https://w3id.org/dgo/domains
    is_a: information content entity
    slots:
    - id
    - label
    class_uri: dgo:DGO_00000018
  material entity:
    name: material entity
    from_schema: https://w3id.org/dgo/datasets
    class_uri: bfo:0000040
  material information bearer:
    name: material information bearer
    from_schema: https://w3id.org/dgo/datasets
    is_a: material entity
    class_uri: iao:0000178
  data entity:
    name: data entity
    from_schema: https://w3id.org/dgo/datasets
    class_uri: iao:0000027
  directive information entity:
    name: directive information entity
    from_schema: https://w3id.org/dgo/datasets
    class_uri: iao:0000033
  data store:
    name: data store
    description: 'A system kept and governed for storing data (a data warehouse, a
      clinical system''s reporting database, a file share): the material information
      bearer, often an aggregate of disks and servers, in which the data sets it carries
      are concretized. The data sets generically depend on it. The operational system,
      not its logical design: a database schema is an information content entity,
      not a data store. It carries no domain of its own: the data sets and data elements
      it holds are what carry domains.'
    from_schema: https://w3id.org/dgo/datasets
    is_a: material information bearer
    slots:
    - id
    - label
    - description
    - responsibilities
    class_uri: dgo:DGO_00000037
  data set:
    name: data set
    description: 'A governed collection of data elements (IAO data collection: a data
      entity that consists of multiple data entities). Its domains follow from its
      subject areas; its terms are those informed by its data elements. A data set
      is certified when a data set certification that has it as output reaches an
      approved boundary. A data set that is derived from no other is a source of truth.'
    from_schema: https://w3id.org/dgo/datasets
    close_mappings:
    - dcat:Dataset
    is_a: data entity
    slots:
    - id
    - label
    - description
    - stored_in
    - in_subject_area
    - derived_from
    - sensitivity
    - security_level
    - regulatory_categories
    - responsibilities
    slot_usage:
      in_subject_area:
        name: in_subject_area
        required: false
        multivalued: true
      derived_from:
        name: derived_from
        range: data set
    class_uri: iao:0001000
  data element:
    name: data element
    description: 'A field or column within one data set: all of that set''s values
      for one attribute. The same attribute held in another set is another data element,
      linked to this one by derived from. Its subject areas, and so its domains, are
      those of its data set.'
    from_schema: https://w3id.org/dgo/datasets
    is_a: data entity
    slots:
    - id
    - label
    - description
    - part_of
