    class_uri: dgo:DGO_00000019
  definition source:
    name: definition source
    description: A source that a term's definition is drawn from. Its id is the source's
      IRI; its label describes the source. Many terms may cite one source.
    from_schema: https://w3id.org/dgo/glossary
    is_a: information content entity
    slots:
    - id
    - label
    class_uri: dgo:DGO_00000030
  term lifecycle process:
    name: term lifecycle process
    description: A governance process that brings a business term into, or changes
      it within, the business glossary.
    from_schema: https://w3id.org/dgo/glossary
    is_a: lifecycle process
    slot_usage:
      has_output:
        name: has_output
        range: glossary term
        required: true
    class_uri: dgo:DGO_00000020
  term creation:
    name: term creation
    description: The process by which a new governed business term is proposed, validated,
      and approved for publishing in the  business glossary.
    from_schema: https://w3id.org/dgo/glossary
    is_a: term lifecycle process
    class_uri: dgo:DGO_00000021
  term modification:
    name: term modification
    description: The process by which an extant governed business term is proposed
      to be modified, validated, and approved for publishing in the business glossary.
    from_schema: https://w3id.org/dgo/glossary
    is_a: term lifecycle process
    class_uri: dgo:DGO_00000022
  term deprecation:
    name: term deprecation
    description: The process by which an extant governed business term is proposed
