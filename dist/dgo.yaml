  data set certification:
    name: data set certification
    description: The process by which a data set is reviewed and approved as fit for
      consumers by the responsible data governance council. The data set is certified
      once this process reaches its approved boundary, whose date is the certification
      date.
    from_schema: https://w3id.org/dgo/datasets
    is_a: lifecycle process
    slot_usage:
      has_output:
        name: has_output
        range: data set
        required: true
    class_uri: dgo:DGO_00000039
  data classification:
    name: data classification
    description: A level in an organization's scheme for classifying data, which prescribes
      how data so classified must be handled. Organizations define their own levels
      as instances of its subclasses.
    from_schema: https://w3id.org/dgo/datasets
    is_a: directive information entity
    abstract: true
    slots:
    - id
    - label
    - definition
    class_uri: dgo:DGO_00000040
  sensitivity level:
    name: sensitivity level
    description: A level of harm that disclosure of the data would cause (e.g. public,
      internal, confidential, restricted).
    from_schema: https://w3id.org/dgo/datasets
    is_a: data classification
    slots:
    - severity
    class_uri: dgo:DGO_00000041
  security level:
    name: security level
    description: A level of access control the data requires (e.g. open, role-based,
      need-to-know).
    from_schema: https://w3id.org/dgo/datasets
    is_a: data classification
    slots:
    - severity
    class_uri: dgo:DGO_00000042
  regulatory category:
